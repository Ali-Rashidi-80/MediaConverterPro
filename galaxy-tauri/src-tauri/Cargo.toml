[package]
name = "galaxy-tauri"
version = "3.1.0"
description = "Galaxy Media Pro — Studio Edition"
edition = "2021"

[lib]
name = "galaxy_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
parking_lot = "0.12"
dunce = "1.0"
num_cpus = "1.16"
dirs = "5"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "avif", "ico", "bmp", "tiff"] }
rayon = "1.10"
sysinfo = "0.32"
which = "7"
webp = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

