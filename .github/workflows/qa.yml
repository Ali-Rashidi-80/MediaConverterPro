name: QA Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  qa-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Headless-safe Qt for pytest-qt / PySide6 on GitHub-hosted runners
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Bootstrap FFmpeg (if not bundled)
        run: python tools/bootstrap_ffmpeg.py

      - name: Verify FFmpeg capabilities
        run: python tools/verify_ffmpeg_caps.py

      - name: Full QA gate
        run: python tools/qa_full.py --full
